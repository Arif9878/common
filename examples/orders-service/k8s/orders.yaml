# The example on Kubernetes. Settings shared by every service live in the
# observability ConfigMap; this service's own settings, in its Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability
data:
  OTLP_ENDPOINT: otel-collector.observability:4317
  OTLP_INSECURE: "true"
  TRACING_EXPORTER: otlp
  METRICS_EXPORTER: prometheus # scraped through the admin port; or otlp
  LOGS_EXPORTER: otlp
  LOG_OUTPUT: both
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
stringData:
  POSTGRES_PASSWORD: change-me # in production: from Vault or an external secret operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: orders }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      terminationGracePeriodSeconds: 60 # above the 45s fx stop timeout
      containers:
        - name: orders
          image: registry.example/orders-service:0.1.0
          ports:
            - { name: http, containerPort: 8080 }
            - { name: admin, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: observability }
            - secretRef: { name: orders-db }
          env:
            - name: OTEL_SERVICE_NAME
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/name']" } }
            - name: SERVICE_VERSION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/version']" } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=$(SERVICE_VERSION),deployment.environment.name=production,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE)
            - { name: POSTGRES_HOST, value: postgres.data }
            - { name: POSTGRES_DATABASE, value: orders }
            - { name: POSTGRES_USER, value: orders }
            - { name: REDIS_ADDRS, value: redis.data:6379 }
            - { name: KAFKA_BROKERS, value: "kafka-0.kafka.data:9092,kafka-1.kafka.data:9092" }
          startupProbe:
            httpGet: { path: /startup, port: admin }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /ready, port: admin }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /live, port: admin }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: { app.kubernetes.io/name: orders }
  ports:
    - { name: http, port: 80, targetPort: http }
