version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        # Every exported identifier is documented: the Go documentation is
        # the API reference (see COMPATIBILITY.md).
        - name: exported
          arguments: ["disableStutteringCheck"]
    depguard:
      rules:
        production:
          files:
            - "!$test"
            - "!**/testkit/**" # testkit's own helpers may build on it
            - "!**/redistest/**"
            - "!**/kafkatest/**"
          deny:
            - pkg: github.com/Arif9878/common/go/testkit
              desc: production packages must not depend on testkit
            - pkg: github.com/Arif9878/common/go/datastore/redis/redistest
              desc: production packages must not depend on test helpers
            - pkg: github.com/Arif9878/common/go/messaging/kafka/kafkatest
              desc: production packages must not depend on test helpers
        all:
          deny:
            - pkg: github.com/satori/go.uuid
              desc: unmaintained; use github.com/google/uuid
            - pkg: github.com/sirupsen/logrus
              desc: use log/slog
            - pkg: github.com/lib/pq
              desc: use github.com/jackc/pgx/v5
  exclusions:
    presets:
      - std-error-handling
    rules:
      # The client tests use a fake transport that constructs responses;
      # bodyclose cannot follow their ownership.
      - path: ^transport/http/httpclient/.*_test\.go$
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Arif9878/common/go
