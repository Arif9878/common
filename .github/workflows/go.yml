name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: make tidy vet test
      - run: make -C fx tidy vet test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/go.sum
      - run: make lint
      - run: make -C fx lint

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/go.sum
      - run: make vuln
      - run: make -C fx vuln

  kafka:
    # The Kafka tests use an in-process fake by default; this job runs them
    # against a real broker (Redpanda, single node) as well.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/go.sum
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 8081:8081 redpandadata/redpanda:v26.2.4 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://localhost:9092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health --exit-when-healthy --watch 2>/dev/null &&
              curl -sf localhost:8081/subjects >/dev/null && exit 0 # the schema registry is up too
            sleep 2
          done
          docker logs redpanda
          exit 1
      - run: make test-kafka KAFKA_TEST_BROKERS=localhost:9092 SCHEMA_REGISTRY_TEST_URL=http://localhost:8081
