name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: go

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
      # The Redis stores and locks run their Lua scripts on real Redis as
      # well as on miniredis.
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@localhost:5432/app
      REDIS_TEST_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/**/go.sum
          check-latest: true # security fixes ship as patch releases
      - run: make tidy vet
      - run: make test COVER=${{ matrix.go == '1.27.x' && '1' || '' }}
      - if: matrix.go == '1.27.x'
        run: make cover-summary >> "$GITHUB_STEP_SUMMARY"
      - run: make examples # builds, lints and tests examples/ against this checkout

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/**/go.sum
          check-latest: true # security fixes ship as patch releases
      - run: make lint
      - run: make envdoc-check # ENVIRONMENT.md matches the configuration structs

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Pinned to the newest patch: govulncheck reports standard
          # library issues of the Go it runs with, and the 1.27.x range
          # lags new releases. Raise it with each Go security release.
          go-version: "1.27.2"
          cache-dependency-path: go/**/go.sum
          check-latest: true # security fixes ship as patch releases
      - run: make vuln

  kafka:
    # The Kafka tests use an in-process fake by default; this job runs them
    # against a real broker (Redpanda, single node) as well.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/**/go.sum
          check-latest: true # security fixes ship as patch releases
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 -p 8081:8081 redpandadata/redpanda:v26.2.4 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://localhost:9092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health --exit-when-healthy --watch 2>/dev/null &&
              curl -sf localhost:8081/subjects >/dev/null && exit 0 # the schema registry is up too
            sleep 2
          done
          docker logs redpanda
          exit 1
      - run: make test-kafka KAFKA_TEST_BROKERS=localhost:9092 SCHEMA_REGISTRY_TEST_URL=http://localhost:8081
